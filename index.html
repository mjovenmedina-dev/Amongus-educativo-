<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Among Us Educativo</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #101827; color: white; font-family: Arial, sans-serif; }
header { text-align: center; padding: 25px 12px; background: #17243a; border-bottom: 3px solid #38bdf8; }
h1 { color: #38bdf8; }
main { max-width: 850px; margin: auto; padding: 20px; }
.panel { background: #1e293b; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
button, input, select { width: 100%; padding: 12px; margin: 7px 0; border-radius: 8px; font-size: 16px; }
button { background: #2563eb; color: white; border: 0; cursor: pointer; font-weight: bold; }
button:hover { background: #1d4ed8; }
.secondary { background: #15803d; }
.back { background: #475569; }
input, select { border: 1px solid #64748b; }
label { display: block; margin-top: 12px; }
.hidden { display: none; }
.question { border: 1px solid #475569; padding: 12px; border-radius: 10px; margin: 12px 0; }
small { color: #cbd5e1; }
#jugadoresConectados { padding-left: 25px; }
#jugadoresConectados li { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>🚀 AMONG US EDUCATIVO</h1>
  <p>¡Aprende, responde y descubre al impostor!</p>
</header>
 
<main>
<section id="inicio" class="panel">
  <h2>Bienvenido a la nave</h2>
  <p>Selecciona tu sala para comenzar.</p>
  <button onclick="mostrar('profesor')">👩‍🏫 Sala del profesor</button>
  <button class="secondary" onclick="mostrar('estudiante')">👨‍🚀 Sala de estudiantes</button>
</section>
 
<section id="profesor" class="panel hidden">
  <h2>👩‍🏫 Sala del profesor</h2>
  <label for="nombreProfesor">Nombre del profesor</label>
  <input id="nombreProfesor" placeholder="Escribe tu nombre">
  <label for="mapa">Mapa de la partida</label>
  <select id="mapa">
    <option value="Nave espacial">Nave espacial</option>
    <option value="Estación">Estación espacial</option>
    <option value="Base lunar">Base lunar</option>
  </select>
  <label for="impostores">Cantidad de impostores</label>
  <select id="impostores">
    <option>1</option><option>2</option><option>3</option>
    <option>4</option><option>5</option><option>6</option>
  </select>
  <h3>Preguntas de la partida</h3>
  <div id="preguntas"></div>
  <button type="button" onclick="agregarPregunta()">➕ Agregar pregunta</button>
  <button type="button" class="secondary" onclick="crearPartida()">Crear partida</button>
  <div id="resultadoProfesor"></div>
  <div id="listajugadores">
    <h3>Jugadores conectados</h3>
    <p id="contadorJugadores">Jugadores: 0</p>
    <ul id="jugadoresConectados"><li>Esperando jugadores...</li></ul>
  </div>
  <button class="back" onclick="mostrar('inicio')">Volver al inicio</button>
</section>
 
<section id="estudiante" class="panel hidden">
  <h2>👨‍🚀 Sala de estudiantes</h2>
  <label for="nombreEstudiante">Tu nombre</label>
  <input id="nombreEstudiante" placeholder="Escribe tu nombre">
  <label for="codigoEntrada">Código de la partida</label>
  <input id="codigoEntrada" placeholder="Ejemplo: A7K9P2" autocomplete="off">
  <button class="secondary" onclick="entrarPartida()">Entrar a la nave</button>
  <div id="resultadoEstudiante"></div>
  <button class="back" onclick="mostrar('inicio')">Volver al inicio</button>
</section>
</main>
 
<!-- Firebase debe cargarse antes del código que lo utiliza. -->
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
 
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBYJf5QtU05y0463ONUKypc0SNBzvhsxX4",
  authDomain: "amongus-class-m2010.firebaseapp.com",
  databaseURL: "https://amongus-class-m2010-default-rtdb.firebaseio.com",
  projectId: "amongus-class-m2010",
  storageBucket: "amongus-class-m2010.firebasestorage.app",
  messagingSenderId: "259725936012",
  appId: "1:259725936012:web:786527b20688c9645e02a9"
};
 
window.firebaseReady = false;
window.db = null;
window.userId = null;
 
firebase.initializeApp(firebaseConfig);
firebase.auth().signInAnonymously()
  .then((credential) => {
    window.userId = credential.user.uid;
    window.db = firebase.database();
    window.firebaseReady = true;
    console.log("Firebase listo para el juego. UID:", window.userId);
  })
  .catch((error) => {
    console.error("Error de Firebase:", error);
    alert("No se pudo conectar con Firebase. Revisa la configuración y la autenticación anónima.");
  });
 
let numeroPreguntas = 0;
let dejarDeEscucharJugadores = null;
 
function mostrar(id) {
  document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
 
function escapar(texto) {
  return String(texto).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
 
function agregarPregunta() {
  numeroPreguntas++;
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `
    <h4>Pregunta ${numeroPreguntas}</h4>
    <input class="enunciado" placeholder="Escribe la pregunta">
    <input class="opcionA" placeholder="Opción A">
    <input class="opcionB" placeholder="Opción B">
    <input class="opcionC" placeholder="Opción C">
    <input class="correcta" placeholder="Respuesta correcta (A, B o C)" maxlength="1">
    <button type="button" class="back">Eliminar pregunta</button>`;
  div.querySelector("button").addEventListener("click", () => div.remove());
  document.getElementById("preguntas").appendChild(div);
}
 
async function crearPartida() {
  const nombre = document.getElementById("nombreProfesor").value.trim();
  const bloques = [...document.querySelectorAll("#preguntas .question")];
  const resultado = document.getElementById("resultadoProfesor");
 
  const preguntas = bloques.map(b => ({
    texto: b.querySelector(".enunciado").value.trim(),
    A: b.querySelector(".opcionA").value.trim(),
    B: b.querySelector(".opcionB").value.trim(),
    C: b.querySelector(".opcionC").value.trim(),
    correcta: b.querySelector(".correcta").value.trim().toUpperCase()
  }));
 
  if (!nombre) return alert("Escribe el nombre del profesor.");
  if (!preguntas.length || preguntas.some(p =>
    !p.texto || !p.A || !p.B || !p.C || !["A", "B", "C"].includes(p.correcta)
  )) return alert("Completa todas las preguntas y escribe A, B o C en la respuesta correcta.");
 
  if (!window.firebaseReady || !window.db || !window.userId) {
    return alert("Firebase todavía no está listo. Espera unos segundos e inténtalo de nuevo.");
  }
 
  const preguntasPublicas = {};
  const respuestasCorrectas = {};
  preguntas.forEach((p, i) => {
    preguntasPublicas[i] = { texto: p.texto, A: p.A, B: p.B, C: p.C };
    respuestasCorrectas[i] = p.correcta;
  });
 
  const partida = {
    ownerUid: window.userId,
    nombre,
    mapa: document.getElementById("mapa").value,
    impostores: Number(document.getElementById("impostores").value),
    preguntas: preguntasPublicas,
    iniciada: false
  };
 
  try {
    let codigo;
    let referencia;
    let creada = false;
 
    for (let intento = 0; intento < 5; intento++) {
      codigo = Math.random().toString(36).substring(2, 8).toUpperCase();
      referencia = window.db.ref("partidas/" + codigo);
      const existe = await referencia.child("info").once("value");
      if (!existe.exists()) {
        creada = true;
        break;
      }
    }
    if (!creada) throw new Error("No se pudo generar un código único. Inténtalo de nuevo.");
 
    await referencia.child("info").set(partida);
    await referencia.child("respuestas").set(respuestasCorrectas);
 
    resultado.innerHTML = `
      <h3>¡Partida creada!</h3>
      <p>Tu código es:</p>
      <h2>${escapar(codigo)}</h2>
      <p>Mapa: ${escapar(partida.mapa)}</p>
      <p>Preguntas: ${preguntas.length}</p>
      <small>Comparte el código con tus estudiantes.</small>`;
    escucharJugadores(codigo);
  } catch (error) {
    console.error("Error al crear la partida:", error);
    resultado.textContent = "No se pudo crear la partida. Revisa la conexión y las reglas de Firebase.";
  }
}
 
async function entrarPartida() {
  const nombre = document.getElementById("nombreEstudiante").value.trim();
  const codigo = document.getElementById("codigoEntrada").value.trim().toUpperCase();
  const resultado = document.getElementById("resultadoEstudiante");
 
  if (!nombre || !codigo) return alert("Escribe tu nombre y el código de la partida.");
  if (!window.firebaseReady || !window.db || !window.userId) {
    return alert("Firebase todavía no está listo. Espera unos segundos e inténtalo de nuevo.");
  }
 
  resultado.textContent = "Buscando la partida...";
  try {
    const consulta = await window.db.ref("partidas/" + codigo + "/info").once("value");
    if (!consulta.exists()) {
      resultado.textContent = "No se encontró la partida. Revisa el código.";
      return;
    }
 
    const partida = consulta.val();
    await window.db.ref("partidas/" + codigo + "/jugadores/" + window.userId).set({
      nombre,
      unido: true,
      uid: window.userId
    });
 
    resultado.innerHTML = `
      <h3>¡Bienvenido a la nave, ${escapar(nombre)}!</h3>
      <p>Profesor: ${escapar(partida.nombre || "")}</p>
      <p>Mapa: ${escapar(partida.mapa || "")}</p>
      <p>Preguntas: ${Object.keys(partida.preguntas || {}).length}</p>
      <p>¡Te has unido a la partida!</p>
      <p>La partida aún no ha comenzado.</p>`;
  } catch (error) {
    console.error("Error al entrar a la partida:", error);
    resultado.textContent = "No se pudo entrar. Revisa la conexión y las reglas de Firebase.";
  }
}
 
function escucharJugadores(codigo) {
  if (!window.firebaseReady || !window.db) {
    console.error("Firebase todavía no está listo; no se puede escuchar la lista.");
    return;
  }
 
  if (dejarDeEscucharJugadores) {
    dejarDeEscucharJugadores();
    dejarDeEscucharJugadores = null;
  }
 
  const referencia = window.db.ref("partidas/" + codigo + "/jugadores");
  const lista = document.getElementById("jugadoresConectados");
  const contador = document.getElementById("contadorJugadores");
 
  const actualizarLista = (snapshot) => {
    const jugadores = snapshot.val() || {};
    const participantes = Object.values(jugadores).filter(j => j && j.unido === true);
 
    contador.textContent = "Jugadores: " + participantes.length;
    lista.innerHTML = "";
 
    if (participantes.length === 0) {
      lista.innerHTML = "<li>Esperando jugadores...</li>";
      return;
    }
 
    participantes.forEach(jugador => {
      const elemento = document.createElement("li");
      elemento.textContent = jugador.nombre || "Jugador";
      lista.appendChild(elemento);
    });
  };
 
  const alError = (error) => {
    console.error("No se pudo leer la lista de jugadores:", error);
    lista.innerHTML = "<li>No se pudo cargar la lista. Revisa los permisos de lectura en Firebase.</li>";
  };
 
  referencia.on("value", actualizarLista, alError);
  dejarDeEscucharJugadores = () => referencia.off("value", actualizarLista);
}
 
agregarPregunta();
</script>
</body>
</html>
