
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Among Us Educativo</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 25px 12px;
  background: #17243a;
  border-bottom: 3px solid #38bdf8;
}
h1 { color: #38bdf8; }
main { max-width: 850px; margin: auto; padding: 20px; }
.panel {
  background: #1e293b;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
}
button, input, select {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 8px;
  font-size: 16px;
}
button {
  background: #2563eb;
  color: white;
  border: 0;
  cursor: pointer;
  font-weight: bold;
}
button:hover { background: #1d4ed8; }
.secondary { background: #15803d; }
.back { background: #475569; }
input, select { border: 1px solid #64748b; }
label { display: block; margin-top: 12px; }
.hidden { display: none; }
.question {
  border: 1px solid #475569;
  padding: 12px;
  border-radius: 10px;
  margin: 12px 0;
}
small { color: #cbd5e1; }
</style>
</head>
<body>
<header>
  <h1>🚀 AMONG US EDUCATIVO</h1>
  <p>¡Aprende, responde y descubre al impostor!</p>
</header>

<main>
<section id="inicio" class="panel">
  <h2>Bienvenido a la nave</h2>
  <p>Selecciona tu sala para comenzar.</p>
  <button onclick="mostrar('profesor')">👩‍🏫 Sala del profesor</button>
  <button class="secondary" onclick="mostrar('estudiante')">👨‍🚀 Sala de estudiantes</button>
</section>

<section id="profesor" class="panel hidden">
  <h2>👩‍🏫 Sala del profesor</h2>
  <label>Nombre del profesor</label>
  <input id="nombreProfesor" placeholder="Escribe tu nombre">
  <label>Mapa de la partida</label>
  <select id="mapa">
    <option value="Nave espacial">Nave espacial</option>
    <option value="Estación">Estación espacial</option>
    <option value="Base lunar">Base lunar</option>
  </select>
  <label>Cantidad de impostores</label>
  <select id="impostores">
    <option>1</option><option>2</option><option>3</option>
    <option>4</option><option>5</option><option>6</option>
  </select>
  <h3>Preguntas de la partida</h3>
  <div id="preguntas"></div>
  <button onclick="agregarPregunta()">➕ Agregar pregunta</button>
  <button class="secondary" onclick="crearPartida()">Crear partida</button>
  <div id="resultadoProfesor"></div>
  <div id="listajugadores">
  <h3>jugadoresconectados</h3>
    <p id="contadorjugadores">jugadores:0</p>
    <ul id="jugadoresconectados">
      <li>Esperando jugadores...</li>
    </ul>
  </div>
      <button class="back" onclick="mostrar('inicio')">Volver al inicio</button>
</section>

<section id="estudiante" class="panel hidden">
  <h2>👨‍🚀 Sala de estudiantes</h2>
  <label>Tu nombre</label>
  <input id="nombreEstudiante" placeholder="Escribe tu nombre">
  <label>Código de la partida</label>
  <input id="codigoEntrada" placeholder="Ejemplo: A7K9P2">
  <button class="secondary" onclick="entrarPartida()">Entrar a la nave</button>
  <div id="resultadoEstudiante"></div>
  <button class="back" onclick="mostrar('inicio')">Volver al inicio</button>
</section>
</main>

<script>
let numeroPreguntas = 0;

function mostrar(id) {
  document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function agregarPregunta() {
  numeroPreguntas++;
  const div = document.createElement('div');
  div.className = 'question';
  div.innerHTML = `
    <h4>Pregunta ${numeroPreguntas}</h4>
    <input class="enunciado" placeholder="Escribe la pregunta">
    <input class="opcionA" placeholder="Opción A">
    <input class="opcionB" placeholder="Opción B">
    <input class="opcionC" placeholder="Opción C">
    <input class="correcta" placeholder="Respuesta correcta (A, B o C)">
    <button type="button" onclick="this.parentElement.remove()">Eliminar pregunta</button>`;
  document.getElementById('preguntas').appendChild(div);
}


async function crearPartida() {
  const nombre = document.getElementById('nombreProfesor').value.trim();
  const bloques = [...document.querySelectorAll('#preguntas .question')];

  const preguntas = bloques.map(b => ({
    texto: b.querySelector('.enunciado').value.trim(),
    A: b.querySelector('.opcionA').value.trim(),
    B: b.querySelector('.opcionB').value.trim(),
    C: b.querySelector('.opcionC').value.trim(),
    correcta: b.querySelector('.correcta').value.trim().toUpperCase()
  }));

  if (!nombre) {
    alert('Escribe el nombre del profesor.');
    return;
  }

  if (!preguntas.length || preguntas.some(p =>
    !p.texto || !p.A || !p.B || !p.C ||
    !['A', 'B', 'C'].includes(p.correcta)
  )) {
    alert('Completa las preguntas y sus respuestas correctas (A, B o C).');
    return;
  }

  if (!window.firebaseReady || !window.db || !window.userId) {
    alert('Firebase todavía no está listo. Espera unos segundos y vuelve a intentarlo.');
    return;
  }

  const codigo = Math.random().toString(36).substring(2, 8).toUpperCase();

  const preguntasPublicas = {};
  const respuestasCorrectas = {};

  preguntas.forEach((p, i) => {
    preguntasPublicas[i] = {
      texto: p.texto,
      A: p.A,
      B: p.B,
      C: p.C
    };
    respuestasCorrectas[i] = p.correcta;
  });

  const partida = {
    ownerUid: window.userId,
    nombre: nombre,
    mapa: document.getElementById('mapa').value,
    impostores: Number(document.getElementById('impostores').value),
    preguntas: preguntasPublicas,
    iniciada: false
  };

  try {
    const referencia = window.db.ref('partidas/' + codigo);

    const existe = await referencia.child('info').once('value');

    if (existe.exists()) {
      alert('El código coincidió con otra partida. Intenta crearla otra vez.');
      return;
    }

    await referencia.child('info').set(partida);
    await referencia.child('respuestas').set(respuestasCorrectas);
    escucharJugadores(codigo);

    document.getElementById('resultadoProfesor').innerHTML = `
      <h3>¡Partida creada!</h3>
      <p>Tu código es:</p>
      <h2>${codigo}</h2>
      <p>Mapa: ${escapar(partida.mapa)}</p>
      <p>Preguntas: ${preguntas.length}</p>
      <small>Comparte el código con tus estudiantes.</small>
    `;
  } catch (error) {
    console.error('Error al crear la partida:', error);
    alert('No se pudo crear la partida en Firebase. Revisa las reglas de la base de datos.');
  }
      }


async function entrarPartida() {
  const nombre = document.getElementById('nombreEstudiante').value.trim();
  const codigo = document.getElementById('codigoEntrada').value.trim().toUpperCase();
  const resultado = document.getElementById('resultadoEstudiante');

  if (!nombre || !codigo) {
    alert('Escribe tu nombre y el código de la partida.');
    return;
  }

  if (!window.firebaseReady || !window.db || !window.userId) {
    alert('Firebase todavía no está listo. Espera unos segundos e inténtalo de nuevo.');
    return;
  }

  resultado.textContent = 'Buscando la partida...';

  try {
    const referencia = window.db.ref('partidas/' + codigo + '/info');
    const consulta = await referencia.once('value');

    if (!consulta.exists()) {
      resultado.innerHTML = '<p>No se encontró la partida. Revisa el código e inténtalo de nuevo.</p>';
      return;
    }

    const partida = consulta.val();

    await window.db.ref(
      'partidas/' + codigo + '/jugadores/' + window.userId
    ).set({
      nombre: nombre,
      unido: true
    });

    resultado.innerHTML = `
      <h3>¡Bienvenido a la nave, ${escapar(nombre)}!</h3>
      <p>Profesor: ${escapar(partida.nombre || '')}</p>
      <p>Mapa: ${escapar(partida.mapa || '')}</p>
      <p>Preguntas: ${Object.keys(partida.preguntas || {}).length}</p>
      <p>¡Te has unido a la partida!</p>
      <p>La partida aún no ha comenzado.</p>
    `;
  } catch (error) {
    console.error('Error al entrar a la partida:', error);
    resultado.innerHTML =
      '<p>No se pudo entrar a la partida. Comprueba la conexión y las reglas de Firebase.</p>';
  }
  }

let dejarDeEscucharJugadores = null;

function escucharJugadores(codigo) {
  if (!window.firebaseReady || !window.db) {
    return;
  }

  if (dejarDeEscucharJugadores) {
    dejarDeEscucharJugadores();
  }

  const referencia = window.db.ref(
    'partidas/' + codigo + '/jugadores'
  );

  const actualizarLista = (snapshot) => {
    const lista = document.getElementById('jugadoresConectados');
    const contador = document.getElementById('contadorJugadores');

    const jugadores = snapshot.val() || {};
    const participantes = Object.values(jugadores);

    contador.textContent = 'Jugadores: ' + participantes.length;
    lista.innerHTML = '';

    if (participantes.length === 0) {
      lista.innerHTML = '<li>Esperando jugadores...</li>';
      return;
    }

    participantes.forEach((jugador) => {
      const elemento = document.createElement('li');
      elemento.textContent = jugador.nombre || 'Jugador';
      lista.appendChild(elemento);
    });
  };

  referencia.on('value', actualizarLista);

  dejarDeEscucharJugadores = () => {
    referencia.off('value', actualizarLista);
  };
  }
function escapar(texto) {
  return texto.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[c]);
}

agregarPregunta();
</script>

</body>
</html>
